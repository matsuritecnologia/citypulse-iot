<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto Tecnológico 1 Medios Colegio San Lucas - CityPulse IoT</title>

  <!-- MQTT Paho Client -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <!-- Chart.js para la gráfica en vivo -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; margin: 0; padding: 20px; }
    
    /* --- Cabecera del Colegio y Proyecto --- */
    .header-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .school-logo {
      max-width: 120px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      background-color: #ffffff;
      padding: 5px;
    }

    .main-title { 
      color: #38bdf8; 
      font-size: 2.1em;
      margin: 5px 0 0 0; 
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .project-subtitle { 
      color: #f8fafc; 
      font-size: 1.4em; 
      margin: 5px 0;
      font-weight: 600;
    }
    .tech-info { 
      color: #94a3b8; 
      font-size: 0.9em; 
      margin-bottom: 20px; 
    }

    .banner { padding: 15px; border-radius: 8px; font-size: 1.4em; font-weight: bold; margin-bottom: 25px; transition: background 0.3s; }
    .ok { background-color: #10b981; color: #fff; }
    .alerta { background-color: #ef4444; color: #fff; animation: blink 0.4s infinite alternate; }
    @keyframes blink { from { opacity: 1; } to { opacity: 0.4; } }
    
    .card-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; width: 180px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .val { font-size: 2em; font-weight: bold; color: #38bdf8; margin-top: 10px; }
    
    .chart-container { background: #1e293b; border-radius: 12px; padding: 20px; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  </style>
</head>
<body>

  <!-- Cabecera con Logo y Título Institucional -->
  <div class="header-container">
    <img src="sanlucas.png" alt="Logo Colegio San Lucas" class="school-logo">
    <h1 class="main-title">PROYECTO TECNOLÓGICO 1 MEDIOS COLEGIO SAN LUCAS</h1>
    <div class="project-subtitle">CityPulse IoT ── Dashboard Urbano</div>
    <div class="tech-info">Monitoreo Sismológico y Ambiental en Tiempo Real via WebSockets (HiveMQ)</div>
  </div>

  <div id="statusBanner" class="banner ok">SISTEMA NORMAL - SIN ACTIVIDAD SÍSMICA</div>

  <div class="card-container">
    <div class="card">
      <h3>Aceleración</h3>
      <div id="magVal" class="val">0.00 G</div>
    </div>
    <div class="card">
      <h3>Temperatura</h3>
      <div id="tempVal" class="val">-- °C</div>
    </div>
    <div class="card">
      <h3>Humedad</h3>
      <div id="humVal" class="val">-- %</div>
    </div>
  </div>

  <!-- Sismógrafo -->
  <div class="chart-container">
    <h3>Sismógrafo en Tiempo Real (Onda de Aceleración)</h3>
    <canvas id="seismographChart"></canvas>
  </div>

  <script>
    // Configuración de Chart.js
    const ctx = document.getElementById('seismographChart').getContext('2d');
    const maxDataPoints = 30;

    const seismographChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: 'Aceleración (G)',
          data: [],
          borderColor: '#38bdf8',
          backgroundColor: 'rgba(56, 189, 248, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.3,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        animation: false,
        scales: {
          x: { display: false },
          y: { 
            min: 0, 
            max: 3, 
            grid: { color: '#334155' },
            ticks: { color: '#94a3b8' }
          }
        },
        plugins: {
          legend: { labels: { color: '#f8fafc' } }
        }
      }
    });

    // Configuración MQTT
    const host = "broker.hivemq.com";
    const port = 8884;
    const topic = "citypulse_feria_2026/datos";

    const client = new Paho.MQTT.Client(host, port, "web_client_" + parseInt(Math.random() * 1000, 10));

    client.onMessageArrived = function (message) {
      const data = JSON.parse(message.payloadString);
      const now = new Date().toLocaleTimeString();

      document.getElementById('magVal').innerText = data.magnitud.toFixed(2) + " G";
      document.getElementById('tempVal').innerText = data.temp + " °C";
      document.getElementById('humVal').innerText = data.hum + " %";

      const banner = document.getElementById('statusBanner');
      if (data.alerta) {
        banner.innerText = "🚨 ¡ALERTA SÍSMICA DETECTADA! 🚨";
        banner.className = "banner alerta";
        seismographChart.data.datasets[0].borderColor = '#ef4444';
      } else {
        banner.innerText = "SISTEMA NORMAL - SIN ACTIVIDAD SÍSMICA";
        banner.className = "banner ok";
        seismographChart.data.datasets[0].borderColor = '#38bdf8';
      }

      seismographChart.data.labels.push(now);
      seismographChart.data.datasets[0].data.push(data.magnitud);

      if (seismographChart.data.labels.length > maxDataPoints) {
        seismographChart.data.labels.shift();
        seismographChart.data.datasets[0].data.shift();
      }

      seismographChart.update();
    };

    client.connect({
      useSSL: true,
      onSuccess: function () {
        console.log("Conectado con éxito al broker de HiveMQ");
        client.subscribe(topic);
      }
    });
  </script>
</body>
</html>
