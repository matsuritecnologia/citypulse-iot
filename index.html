<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo San Lucas IoT</title>
    <!-- Librería Paho MQTT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 20px;
            width: 200px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        .card h3 { color: #888; }
        .value { font-size: 2.5em; font-weight: bold; margin: 10px 0; }
        #status-box {
            margin-top: 30px;
            padding: 15px;
            border-radius: 5px;
            font-size: 1.2em;
            font-weight: bold;
            background-color: #2e7d32;
        }
        .alert { background-color: #c62828 !important; }
    </style>
</head>
<body>

    <h1>Panel de Control San Lucas IoT</h1>
    <p>Broker: <b>broker.emqx.io</b> | Estado Web: <span id="mqtt-status" style="color: yellow;">Conectando...</span></p>

    <div class="container">
        <div class="card">
            <h3>Magnitud</h3>
            <div class="value" id="val-mag">0.00</div>
            <span>G</span>
        </div>
        <div class="card">
            <h3>Temperatura</h3>
            <div class="value" id="val-temp">0</div>
            <span>°C</span>
        </div>
        <div class="card">
            <h3>Humedad</h3>
            <div class="value" id="val-hum">0</div>
            <span>%</span>
        </div>
    </div>

    <div id="status-box">ESTADO: NORMAL</div>

    <script>
        const host = "broker.emqx.io";
        const port = 8084; // Puerto WebSocket seguro (WSS)
        const topic = "citypulse_feria_2026/datos";
        const clientId = "WebClient_" + Math.random().toString(16).substr(2, 8);

        const client = new Paho.MQTT.Client(host, port, clientId);

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        client.connect({
            onSuccess: onConnect,
            onFailure: function (e) {
                document.getElementById("mqtt-status").innerText = "Error de conexión";
                document.getElementById("mqtt-status").style.color = "red";
                console.log(e);
            },
            useSSL: true
        });

        function onConnect() {
            document.getElementById("mqtt-status").innerText = "Conectado";
            document.getElementById("mqtt-status").style.color = "#4caf50";
            client.subscribe(topic);
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                document.getElementById("mqtt-status").innerText = "Desconectado";
                document.getElementById("mqtt-status").style.color = "red";
            }
        }

        function onMessageArrived(message) {
            try {
                const data = JSON.parse(message.payloadString);
                
                document.getElementById("val-mag").innerText = data.magnitud;
                document.getElementById("val-temp").innerText = data.temperatura;
                document.getElementById("val-hum").innerText = data.humedad;

                const statusBox = document.getElementById("status-box");
                if (data.alerta) {
                    statusBox.innerText = "¡ALERTA SÍSMICA DETECTADA!";
                    statusBox.classList.add("alert");
                } else {
                    statusBox.innerText = "ESTADO: NORMAL";
                    statusBox.classList.remove("alert");
                }
            } catch (e) {
                console.error("Error al procesar JSON:", e);
            }
        }
    </script>
</body>
</html>
